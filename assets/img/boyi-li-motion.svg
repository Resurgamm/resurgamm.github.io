    <style>
        .given-name-tail, .surname-tail { visibility: hidden; }

        @media (prefers-reduced-motion: no-preference) {
            .given-name-tail, .surname-tail {
                visibility: visible;
                animation-name: shorten-name;
            }
            .surname { animation-name: close-gap; }

            .given-name-tail, .surname-tail, .surname {
                animation-duration: 1.8s;
                animation-timing-function: cubic-bezier(.4, 0, .25, 1);
                animation-fill-mode: both;
            }

            @keyframes shorten-name {
                0%, 36% { clip-path: inset(0) fill-box; }
                74%, 100% { clip-path: inset(0 100% 0 0) fill-box; }
            }

            @keyframes close-gap {
                0%, 41% { transform: translateX(82px); }
                94%, 100% { transform: none; }
            }
        }
    </style>
